name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Once daily, UTC
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render animated snakes
        uses: Platane/snk@v3
        with:
          github_user_name: rashmiranjanaiet
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#22d3ee&color_dots=#0f172a,#164e63,#0e7490,#22d3ee,#67e8f9&color_background=#0f172a

      - name: Publish images to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
